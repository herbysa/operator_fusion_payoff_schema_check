[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "herbysa-operator_fusion_payoff_schema_check"
version = "0.1.0"
description = "从样本里推断特征平台工程师·算子融合的收益边界应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "herbysa" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://herbysa.github.io"
Repository = "https://github.com/herbysa/operator_fusion_payoff_schema_check"
Issues = "https://github.com/herbysa/operator_fusion_payoff_schema_check/issues"

[project.scripts]
operator_fusion_payoff_schema_check = "operator_fusion_payoff_schema_check:main"

[tool.setuptools]
py-modules = ["operator_fusion_payoff_schema_check"]
